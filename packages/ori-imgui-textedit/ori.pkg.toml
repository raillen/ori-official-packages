[package]
name = "imtextedit"
version = "0.1.0"
entry = "imtextedit/buffer.orl"
ori_version = "0.3.8"
description = "In-ImGui multiline text editor buffer for Ori (pure Ori + language stub + optional imgui.ui draw)"
