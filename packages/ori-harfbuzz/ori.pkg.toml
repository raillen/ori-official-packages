[package]
name = "harfbuzz"
version = "0.1.0"
entry = "harfbuzz/shape.orl"
ori_version = "0.3.0"
description = "HarfBuzz text shaping for Ori (FreeType faces)"
license = "MIT"
# Shim + HarfBuzz (static .a or ld-script→.so staged by tools/build_linux.sh).
# FreeType symbols come from path-dep native_libs.
native_libs = ["ori_harfbuzz_shim", "harfbuzz"]

[dependencies]
freetype = { path = "../ori-freetype", version = "0.1.0" }
